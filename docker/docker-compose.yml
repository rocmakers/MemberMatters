x-mm-env: &mm-env
  MM_ENV: Production
  MM_SECRET_KEY: ${MM_SECRET_KEY:?Set MM_SECRET_KEY in docker/.env}
  MM_USE_POSTGRES: "true"
  MM_REDIS_HOST: redis://mm-redis:6379/0
  MM_TIME_ZONE: America/New_York
  MM_LANGUAGE_CODE: en-us
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in docker/.env}
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in docker/.env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
  POSTGRES_HOST: mm-postgres

x-mm-app: &mm-app
  image: rocmakers/membermatters:latest

services:
  mm-postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in docker/.env}
    volumes:
      - mm-postgres-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MemberMatters Redis
  mm-redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MemberMatters
  mm-webapp:
    <<: *mm-app
    restart: always
    environment:
      <<: *mm-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - mm-data:/usr/src/data
    depends_on:
      mm-postgres:
        condition: service_healthy
      mm-redis:
        condition: service_healthy
    healthcheck:
      # /admin/login/ is proxied to Django; / would only prove nginx is up
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s

  # MemberMatters Celery Worker
  mm-celery-worker:
    <<: *mm-app
    restart: always
    environment:
      <<: *mm-env
      MM_RUN_MODE: celery_worker
    volumes:
      - mm-data:/usr/src/data
    depends_on:
      mm-webapp:
        condition: service_healthy
      mm-postgres:
        condition: service_healthy
      mm-redis:
        condition: service_healthy

  # MemberMatters Celery Beat
  mm-celery-beat:
    <<: *mm-app
    restart: always
    environment:
      <<: *mm-env
      MM_RUN_MODE: celery_beat
    volumes:
      - mm-data:/usr/src/data
    depends_on:
      mm-webapp:
        condition: service_healthy
      mm-postgres:
        condition: service_healthy
      mm-redis:
        condition: service_healthy

volumes:
  mm-postgres-volume:
  mm-data:
